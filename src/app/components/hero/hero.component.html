<section class="hero" id="top">
  <div class="hero__inner">
    <div class="hero__text">
      <p class="hero__eyebrow">DATA ANALYST · BI &amp; MACHINE LEARNING</p>
      <h1 class="hero__name">{{ profile.name }}</h1>
      <p class="hero__tagline">{{ profile.tagline }}</p>

      <div class="hero__cta">
        <a class="btn btn--primary" href="#experience">View experience</a>
        <a class="btn btn--ghost" href="assets/Fatima_Ezzahra_ADNIBI_CV_Data_Analyst-2-1-1.pdf" download="Fatima_Ezzahra_ADNIBI">Download Resume</a>
      </div>

      <div class="hero__metrics">
        <div class="metric" *ngFor="let m of metrics">
          <span class="metric__value">{{ m.value }}</span>
          <span class="metric__label">{{ m.label }}</span>
        </div>
      </div>
    </div>

    <div class="hero__photo">
      <div class="photo__frame">
        <img
          src="assets/images/fatima-profile.png"
          alt="Portrait of Fatima Ezzahra Adnibi"
          class="photo__img"
        />
      </div>
      <div class="photo__accent" aria-hidden="true"></div>
    </div>
  </div>
</section>
